<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" role="img" aria-labelledby="t">
<title id="t">Recruited: Post one role to every job board, split-test it, and see which brings people worth hiring.</title>
<defs>
<style>
@font-face{font-family:projectrecruitedP7;src:url(data:font/woff2;base64,) format('woff2');font-display:swap;}@font-face{font-family:projectrecruitedP3;src:url(data:font/woff2;base64,) format('woff2');font-display:swap;}@font-face{font-family:projectrecruitedP4;src:url(data:font/woff2;base64,) format('woff2');font-display:swap;}
.nm{font-family:projectrecruitedP7,sans-serif;font-size:30px;fill:#fff;letter-spacing:-.5px}
.tl{font-family:projectrecruitedP3,sans-serif;font-size:16.5px;fill:#a1a1aa}
.tg{font-family:projectrecruitedP4,sans-serif;font-size:12px;fill:#a1a1aa}
.ps{font-family:projectrecruitedP4,sans-serif;font-size:12.5px;fill:#e4e4e7}
.num{font-family:projectrecruitedP7,sans-serif;font-size:120px;fill:url(#numg);opacity:.16;letter-spacing:-6px}
.orbit{animation:spin 7s linear infinite;transform-origin:300.0px 125.0px}
@keyframes spin{to{transform:rotate(360deg)}}
.float{animation:fl 5.5s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.dot{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.orbit,.float,.dot{animation:none}}
</style>
<clipPath id="c"><rect width="600" height="250" rx="24"/></clipPath>
<clipPath id="ic"><rect width="96" height="96" rx="22"/></clipPath>
<mask id="ring"><rect width="600" height="250" rx="24" fill="#fff"/><rect x="1.5" y="1.5" width="597" height="247" rx="22.5" fill="#000"/></mask>
<radialGradient id="glow" cx="18%" cy="0%" r="75%"><stop offset="0" stop-color="#e7dcc8" stop-opacity=".30"/><stop offset="1" stop-color="#e7dcc8" stop-opacity="0"/></radialGradient>
<radialGradient id="glow2" cx="100%" cy="100%" r="60%"><stop offset="0" stop-color="#b08d57" stop-opacity=".12"/><stop offset="1" stop-color="#b08d57" stop-opacity="0"/></radialGradient>
<linearGradient id="numg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e7dcc8"/><stop offset="1" stop-color="#b08d57"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e7dcc8" stop-opacity="0"/><stop offset=".5" stop-color="#e7dcc8"/><stop offset="1" stop-color="#b08d57"/></linearGradient>
</defs>
<g clip-path="url(#c)">
 <rect width="600" height="250" fill="#09090b"/>
 <rect width="600" height="250" fill="url(#glow)"/>
 <rect width="600" height="250" fill="url(#glow2)"/>
 <text x="580" y="236" text-anchor="end" class="num">02</text>
</g>
<g mask="url(#ring)">
 <rect width="600" height="250" rx="24" fill="#fff" fill-opacity=".09"/>
 <g class="orbit"><rect x="300.0" y="121.0" width="600" height="8" fill="url(#beam)" transform="rotate(-20 300.0 125.0)"/></g>
</g>
<g class="float" transform="translate(32 32)">
 <g transform="translate(32 32)">
  <rect width="96" height="96" rx="22" fill="#000"/>
  <image width="96" height="96" clip-path="url(#ic)" href="data:image/png;base64,"/>
  <rect width="96" height="96" rx="22" fill="none" stroke="#fff" stroke-opacity=".14"/>
 </g>
</g>
<g transform="translate(500 36)">
 <rect width="68" height="28" rx="14" fill="#000" fill-opacity=".5" stroke="#fff" stroke-opacity=".12"/>
 <circle class="dot" cx="16" cy="14" r="4" fill="#4ade80"/>
 <text x="27" y="18.5" class="ps">live</text>
</g>
<text x="176" y="110" class="nm">Recruited</text>
<text x="32" y="178" class="tl">Post one role to every job board, split-test</text>
<text x="32" y="200" class="tl">it, and see which brings people worth hiring.</text>
<g transform="translate(176 120)"><g transform="translate(0 0)"><rect width="42" height="26" rx="13" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".1"/><text x="20.9" y="17.5" text-anchor="middle" class="tg">web</text></g><g transform="translate(49.9 0)"><rect width="100" height="26" rx="13" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".1"/><text x="50.1" y="17.5" text-anchor="middle" class="tg">open source</text></g></g>
</svg>